# travel-app（移动端 H5）生产 nginx 配置（k8s 集群内静态文件 + API 反向代理）
# 与 vite.config.js dev proxy 对齐：
#   /api/travel -> travel-api:9206
#   /uploads    -> merchant-upload-api:9208（本地存储模式的媒体文件）
# IM 网关使用 .env.production 中 VITE_IM_WS_URL / VITE_IM_API_URL 指向的
# 独立域名（im.code688.com），不经本 nginx 代理。
# 服务名使用集群内短 DNS（要求与后端同处 namespace simple-admin），
# 跨 namespace 请改为 <svc>.simple-admin.svc.cluster.local

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    # kube-dns 动态解析：后端 Service 尚未创建时前端 Pod 也能正常启动
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    set $travel_api      "http://travel-api:9206";
    set $merchant_upload "http://merchant-upload-api:9208";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- API 反向代理 ----
    location /api/travel {
        proxy_pass $travel_api;
    }

    # 其余 /api 兜底（升级新增非 travel 前缀接口时同源可达）
    location /api {
        proxy_pass $travel_api;
    }

    # 本地存储媒体文件回显
    location /uploads {
        proxy_pass $merchant_upload;
    }

    # ---- SPA history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
